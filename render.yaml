services:
  - type: web
    name: nexdose-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    preDeployCommand: npm run migrate
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: nexdose-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: MQTT_BROKER_URL
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: MQTT_CLIENT_ID
        value: nexdose-backend
      - key: MQTT_TOPIC_PREFIX
        value: nexdose
      - key: DISPENSER_TOTAL_SERVOS
        value: "3"
      - key: DISPENSER_TOTAL_DIVISIONS
        value: "6"

databases:
  - name: nexdose-postgres
    databaseName: dbnexdose
    user: nexdose

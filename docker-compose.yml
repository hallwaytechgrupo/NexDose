services:
  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      PORT: ${PORT:-3000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/3000' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
